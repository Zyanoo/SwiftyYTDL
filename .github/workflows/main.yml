name: Xcode - Build IPA

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    env:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-dependencies
        with:
          path: ./Thirdparties
          key: ${{ runner.os }}-cache-${{ hashFiles('./bootstrap.sh') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Bootstrap
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: ./bootstrap.sh
        shell: bash

      - name: Bump version
        env:
          build_number: ${{ github.run_number }}
        run: xcrun agvtool new-version -all $((47 + build_number))

      - name: Build archive
        run: |
          xcodebuild \
            -workspace SwiftyYTDL.xcworkspace \
            -scheme SwiftyYTDL \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SwiftyYTDL.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          mkdir -p build/output

          xcodebuild \
            -exportArchive \
            -archivePath build/SwiftyYTDL.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftyYTDL-ipa
          path: build/output/*.ipa
